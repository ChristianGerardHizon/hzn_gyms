<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your login code</title>
</head>
<body style="margin:0;padding:0;background-color:#F3F4F6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F3F4F6;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#FFFFFF;border-radius:12px;overflow:hidden;border:1px solid #E5E7EB;">
          <tr>
            <td style="background-color:#0B0B0B;padding:20px 24px;border-bottom:3px solid #22C55E;">
              <p style="margin:0;font-size:18px;font-weight:bold;color:#FFFFFF;letter-spacing:0.02em;">HZN Gyms</p>
              <p style="margin:4px 0 0;font-size:12px;color:#9CA3AF;">HZN systems</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px;">
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#111827;">Your login code</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#374151;">Use this code to sign in to {APP_NAME}. It expires soon.</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 20px;">
                <tr>
                  <td align="center" style="background-color:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:20px;">
                    <p style="margin:0;font-size:36px;letter-spacing:0.28em;font-weight:bold;color:#0B0B0B;font-family:Consolas,Monaco,monospace;">{OTP}</p>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#6B7280;">If you did not request this code, you can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px 24px;border-top:1px solid #F3F4F6;">
              <p style="margin:0;font-size:12px;color:#9CA3AF;">Thanks,<br/>The {APP_NAME} team</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
