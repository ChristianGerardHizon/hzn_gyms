linter:
  rules:
    # turn the rule off completely:
    - avoid_manual_providers_as_generated_provider_dependency: false

analyzer:
  plugins:
    - custom_lint
  errors:
    invalid_annotation_target: ignore
    analysis_options_deprecated_plugins: ignore
  exclude:
    - 'old_lib/**'
    - '**/_index.dart'
    - '**.freezed.dart'
    - '**.g.dart'
    - '**.gr.dart'
    - '**.mapper.dart'
    - '**.gen.dart'
    - '**/generated_plugin_registrant.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
custom_lint:
  enable_all_lint_rules: true

