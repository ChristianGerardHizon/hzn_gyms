  <style id="splash-loading-style">
    #splash-loading {
      position: absolute;
      top: calc(50% + 100px);
      left: 50%;
      transform: translate(-50%, 0);
      margin: 0;
      width: min(90vw, 320px);
      text-align: center;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.02em;
      color: #bbbbbb;
    }

    #splash-loading-note {
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #999999;
    }

    #splash-loading-verb {
      margin: 0;
      font-size: 14px;
      min-height: 1.2em;
    }
  </style>
  
  
  
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    var splashLoadingInterval = null;

    function removeSplashFromWeb() {
      if (splashLoadingInterval != null) {
        clearInterval(splashLoadingInterval);
        splashLoadingInterval = null;
      }
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.getElementById("splash-loading")?.remove();
      document.getElementById("splash-loading-style")?.remove();
      document.body.style.background = "transparent";
    }

    (function () {
      var verbs = [
        "Loading",
        "Initializing",
        "Bootstrapping",
        "Preparing",
        "Warming up",
        "Assembling",
        "Hydrating",
        "Compiling",
        "Unpacking",
        "Provisioning",
        "Orchestrating",
        "Calibrating",
        "Spinning up",
        "Syncing",
        "Connecting",
        "Fetching",
        "Resolving",
        "Configuring",
        "Priming",
        "Awakening",
        "Igniting",
        "Launching",
        "Mounting",
        "Wiring",
        "Linking",
        "Caching",
        "Buffering",
        "Streaming",
        "Decoding",
        "Rendering",
        "Composing",
        "Building",
        "Crafting",
        "Forging",
        "Brewing",
        "Conjuring",
        "Summoning",
        "Materializing",
        "Manifesting",
        "Engaging",
        "Activating",
        "Enabling",
        "Aligning",
        "Tuning",
        "Polishing",
        "Finishing",
        "Finalizing",
        "Settling in",
        "Getting ready",
        "Almost there"
      ];

      function startSplashLoadingRotation() {
        var verbEl = document.getElementById("splash-loading-verb");
        if (!verbEl) return;

        var index = 0;
        verbEl.textContent = verbs[index] + "...";
        splashLoadingInterval = setInterval(function () {
          index = (index + 1) % verbs.length;
          verbEl.textContent = verbs[index] + "...";
        }, 1800);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startSplashLoadingRotation);
      } else {
        startSplashLoadingRotation();
      }

      window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    })();
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  
  
  <div id="splash-loading" role="status" aria-live="polite">
    <p id="splash-loading-note">Initial load may take a moment — please wait</p>
    <p id="splash-loading-verb">Loading...</p>
  </div>
  
  
  
  
  <script src="flutter_bootstrap.js" async=""></script>
