name: Deploy System

# Production runs show the PR title (version only, e.g. v1.2.3). Staging keeps an env prefix.
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Deploy to Staging (manual {0})', inputs.version_bump)
    || (github.event.pull_request.base.ref == 'main' && (github.event.pull_request.title || 'Production'))
    || (github.event.pull_request.base.ref == 'staging' && format('Deploy to Staging — {0}', github.event.pull_request.title))
    || 'Deploy System'
  }}

on:
  pull_request:
    types: [ closed ]
    branches: [ "staging", "main" ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump (same as PR labels version:patch|minor|major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      web_only:
        description: "Build/deploy web only (skip Android APK and mobile signing)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # REQUIRED for creating GitHub Releases

jobs:
  # ==========================================
  # PREFLIGHT: Check version label before staging deploy
  # ==========================================
  preflight-staging:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.base_ref == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.bump_type.outputs.skip }}
      bump: ${{ steps.bump_type.outputs.bump }}
      web_only: ${{ steps.bump_type.outputs.web_only }}
    steps:
      - name: Detect version bump type
        id: bump_type
        run: |
          WEB_ONLY="false"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUMP="${{ github.event.inputs.version_bump }}"
            BUMP="${BUMP:-patch}"
            if [ "${{ github.event.inputs.web_only }}" == "true" ]; then
              WEB_ONLY="true"
            fi
            echo "::notice::Manual dispatch — version bump: $BUMP (web_only=$WEB_ONLY)"
          else
            LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

            if echo "$LABELS" | grep -q '"version:major"'; then
              BUMP="major"
            elif echo "$LABELS" | grep -q '"version:minor"'; then
              BUMP="minor"
            elif echo "$LABELS" | grep -q '"version:patch"'; then
              BUMP="patch"
            else
              echo "::notice::No version label found — skipping staging deploy"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            if echo "$LABELS" | grep -q '"web-only"'; then
              WEB_ONLY="true"
            fi
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "web_only=$WEB_ONLY" >> $GITHUB_OUTPUT
          echo "::notice::Version bump type: $BUMP (web_only=$WEB_ONLY)"

  # ==========================================
  # STAGING: prepare (shared version + secrets)
  # ==========================================
  prepare-staging:
    needs: preflight-staging
    if: needs.preflight-staging.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      staging_ver: ${{ steps.calc_staging.outputs.staging_ver }}
      staging_ver_base: ${{ steps.calc_staging.outputs.staging_ver_base }}
      staging_tag: ${{ steps.resolve_tag.outputs.staging_tag }}
      web_only: ${{ needs.preflight-staging.outputs.web_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deploy secrets exist
        env:
          WEB_ONLY: ${{ needs.preflight-staging.outputs.web_only }}
        run: |
          MISSING=""
          if [ -z "${{ secrets.VERSION_MANAGER_URL }}" ]; then MISSING="$MISSING VERSION_MANAGER_URL"; fi
          if [ -z "${{ secrets.VERSION_COLLECTION_ID }}" ]; then MISSING="$MISSING VERSION_COLLECTION_ID"; fi
          if [ -z "${{ secrets.POCKETBASE_URL_STAGING }}" ]; then MISSING="$MISSING POCKETBASE_URL_STAGING"; fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then MISSING="$MISSING SSH_HOST"; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then MISSING="$MISSING SSH_USER"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then MISSING="$MISSING SSH_PRIVATE_KEY"; fi
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then MISSING="$MISSING SENTRY_AUTH_TOKEN"; fi
          if [ "$WEB_ONLY" != "true" ]; then
            if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then MISSING="$MISSING KEYSTORE_BASE64"; fi
            if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then MISSING="$MISSING KEYSTORE_PASSWORD"; fi
            if [ -z "${{ secrets.KEY_ALIAS }}" ]; then MISSING="$MISSING KEY_ALIAS"; fi
            if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then MISSING="$MISSING KEY_PASSWORD"; fi
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Calculate Staging Version
        id: calc_staging
        env:
          URL: ${{ secrets.VERSION_MANAGER_URL }}
          ID: ${{ secrets.VERSION_COLLECTION_ID }}
          BUMP: ${{ needs.preflight-staging.outputs.bump }}
        run: |
          if [ -z "$URL" ] || [ -z "$ID" ]; then
            echo "::error::Secrets VERSION_MANAGER_URL or VERSION_COLLECTION_ID are missing!"
            exit 1
          fi

          RESPONSE=$(curl -s "$URL/$ID")
          MAJOR=$(echo $RESPONSE | jq -r '.major')
          MINOR=$(echo $RESPONSE | jq -r '.minor')
          PATCH=$(echo $RESPONSE | jq -r '.patch')

          if [ "$MAJOR" == "null" ]; then
             echo "::error::Failed to parse version. Response: $RESPONSE"
             exit 1
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac

          STAGING_VER="$MAJOR.$MINOR.$PATCH-staging"
          STAGING_VER_BASE="$MAJOR.$MINOR.$PATCH"

          echo "staging_ver=$STAGING_VER" >> $GITHUB_OUTPUT
          echo "staging_ver_base=$STAGING_VER_BASE" >> $GITHUB_OUTPUT
          echo "Calculated Staging Version: $STAGING_VER (bump: $BUMP)"

      - name: Resolve unique staging tag
        id: resolve_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_VER_BASE: ${{ steps.calc_staging.outputs.staging_ver_base }}
        run: |
          TAG="staging-${STAGING_VER_BASE}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG")

          if [ "$STATUS" == "200" ]; then
            TAG="${TAG}-build.${{ github.run_number }}"
            echo "::notice::Tag already exists, using $TAG instead."
          fi

          echo "staging_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved staging tag: $TAG"

  # ==========================================
  # STAGING: parallel builds (shared Flutter/pub caches)
  # ==========================================
  build-staging-web:
    needs: prepare-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Build Web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare-staging.outputs.staging_ver }}+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          flutter build web --release --pwa-strategy=none --source-maps \
            --build-name=${{ needs.prepare-staging.outputs.staging_ver }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENV=staging \
            --dart-define=API_URL=${{ secrets.POCKETBASE_URL_STAGING }}
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js
          cp web/privacy-policy.html build/web/privacy-policy.html
          cp web/robots.txt build/web/robots.txt
          mkdir -p build/web/privacy-policy
          cp web/privacy-policy/index.html build/web/privacy-policy/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-web-build
          path: build/web
          retention-days: 1

  build-staging-apk:
    needs: prepare-staging
    if: needs.prepare-staging.outputs.web_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: ./.github/actions/setup-flutter

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/android/app/upload-keystore.jks

      - name: Build APK (Release)
        env:
          CI: "true"
          CM_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare-staging.outputs.staging_ver }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENV=staging \
            --dart-define=API_URL=${{ secrets.POCKETBASE_URL_STAGING }}

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-android-build
          path: build/app
          retention-days: 1

  # ==========================================
  # STAGING: publish after both builds finish
  # ==========================================
  deploy-staging:
    needs: [prepare-staging, build-staging-web, build-staging-apk]
    if: |
      always() &&
      !cancelled() &&
      needs.prepare-staging.result == 'success' &&
      needs.build-staging-web.result == 'success' &&
      (needs.build-staging-apk.result == 'success' || needs.build-staging-apk.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The top-level workflow concurrency group is keyed by github.ref, which
    # is unique per PR merge ref — it does NOT stop two different PRs from
    # deploying to the same staging server at the same time. Serialize here
    # (never cancel a deploy mid-rsync) so concurrent merges can't race on
    # the same remote directory.
    concurrency:
      group: deploy-staging-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-web-build
          path: build/web

      - name: Download Android build artifact
        if: needs.prepare-staging.outputs.web_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: staging-android-build
          path: build/app

      - name: Upload debug symbols and source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare-staging.outputs.staging_ver }}+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: dart run sentry_dart_plugin

      - name: Strip source maps from web bundle
        run: |
          chmod +x scripts/strip-web-source-maps.sh
          ./scripts/strip-web-source-maps.sh

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh staging

      - name: Create Staging Release (with APK)
        if: needs.prepare-staging.outputs.web_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-staging.outputs.staging_tag }}
          target_commitish: ${{ github.sha }}
          name: Deploy ${{ needs.prepare-staging.outputs.staging_ver_base }} to Staging
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Staging Release (web-only)
        if: needs.prepare-staging.outputs.web_only == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-staging.outputs.staging_tag }}
          target_commitish: ${{ github.sha }}
          name: Deploy ${{ needs.prepare-staging.outputs.staging_ver_base }} to Staging (web-only)
          body: "Web-only staging deploy — Android APK was skipped."
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # PRODUCTION: single approval gate
  # ==========================================
  production-gate:
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Production environment approved
        run: echo "Production gate passed"

  # ==========================================
  # PRODUCTION: prepare (shared version + secrets)
  # ==========================================
  prepare-production:
    needs: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prod_ver: ${{ steps.calc_prod.outputs.prod_ver }}
      new_patch: ${{ steps.calc_prod.outputs.new_patch }}
      major: ${{ steps.calc_prod.outputs.major }}
      minor: ${{ steps.calc_prod.outputs.minor }}
      commit_sha: ${{ steps.get_sha.outputs.sha }}
      is_minimum_version: ${{ steps.check_min_ver.outputs.is_minimum_version }}
      web_only: ${{ steps.bump_type.outputs.web_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Capture commit SHA
        id: get_sha
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Detect version bump type
        id: bump_type
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          WEB_ONLY="false"

          if echo "$LABELS" | grep -q '"version:major"'; then
            BUMP="major"
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            BUMP="minor"
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            BUMP="patch"
          else
            echo "::error::Missing version label! Add one of: version:patch, version:minor, version:major"
            exit 1
          fi

          if echo "$LABELS" | grep -q '"web-only"'; then
            WEB_ONLY="true"
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "web_only=$WEB_ONLY" >> $GITHUB_OUTPUT
          echo "::notice::Version bump type: $BUMP (web_only=$WEB_ONLY)"

      - name: Verify deploy secrets exist
        env:
          WEB_ONLY: ${{ steps.bump_type.outputs.web_only }}
        run: |
          MISSING=""
          if [ -z "${{ secrets.VERSION_MANAGER_URL }}" ]; then MISSING="$MISSING VERSION_MANAGER_URL"; fi
          if [ -z "${{ secrets.VERSION_COLLECTION_ID }}" ]; then MISSING="$MISSING VERSION_COLLECTION_ID"; fi
          if [ -z "${{ secrets.POCKETBASE_URL_PROD }}" ]; then MISSING="$MISSING POCKETBASE_URL_PROD"; fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then MISSING="$MISSING SSH_HOST"; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then MISSING="$MISSING SSH_USER"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then MISSING="$MISSING SSH_PRIVATE_KEY"; fi
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then MISSING="$MISSING SENTRY_AUTH_TOKEN"; fi
          if [ -z "${{ secrets.SENTRY_DSN_PROD }}" ]; then MISSING="$MISSING SENTRY_DSN_PROD"; fi
          if [ "$WEB_ONLY" != "true" ]; then
            if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then MISSING="$MISSING KEYSTORE_BASE64"; fi
            if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then MISSING="$MISSING KEYSTORE_PASSWORD"; fi
            if [ -z "${{ secrets.KEY_ALIAS }}" ]; then MISSING="$MISSING KEY_ALIAS"; fi
            if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then MISSING="$MISSING KEY_PASSWORD"; fi
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Check minimum version label
        id: check_min_ver
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"minimum version"'; then
            echo "is_minimum_version=true" >> $GITHUB_OUTPUT
            echo "::notice::This release will also update the minimum required version"
          else
            echo "is_minimum_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Prod Version
        id: calc_prod
        env:
          URL: ${{ secrets.VERSION_MANAGER_URL }}
          ID: ${{ secrets.VERSION_COLLECTION_ID }}
          BUMP: ${{ steps.bump_type.outputs.bump }}
        run: |
          if [ -z "$URL" ] || [ -z "$ID" ]; then
            echo "::error::Secrets Missing!"
            exit 1
          fi

          RESPONSE=$(curl -s "$URL/$ID")
          MAJOR=$(echo $RESPONSE | jq -r '.major')
          MINOR=$(echo $RESPONSE | jq -r '.minor')
          PATCH=$(echo $RESPONSE | jq -r '.patch')

          if [ "$MAJOR" == "null" ]; then exit 1; fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac

          PROD_VER="$MAJOR.$MINOR.$PATCH"

          echo "prod_ver=$PROD_VER" >> $GITHUB_OUTPUT
          echo "new_patch=$PATCH" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

  # ==========================================
  # PRODUCTION: parallel builds
  # ==========================================
  build-production-web:
    needs: prepare-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Build Web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare-production.outputs.prod_ver }}+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          flutter build web --release --pwa-strategy=none --source-maps \
            --build-name=${{ needs.prepare-production.outputs.prod_ver }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENV=prod \
            --dart-define=API_URL=${{ secrets.POCKETBASE_URL_PROD }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_PROD }}
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js
          cp web/privacy-policy.html build/web/privacy-policy.html
          cp web/robots.txt build/web/robots.txt
          mkdir -p build/web/privacy-policy
          cp web/privacy-policy/index.html build/web/privacy-policy/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-web-build
          path: build/web
          retention-days: 1

  build-production-apk:
    needs: prepare-production
    if: needs.prepare-production.outputs.web_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: ./.github/actions/setup-flutter

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/android/app/upload-keystore.jks

      - name: Build APK (Release)
        env:
          CI: "true"
          CM_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare-production.outputs.prod_ver }}+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare-production.outputs.prod_ver }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENV=prod \
            --dart-define=API_URL=${{ secrets.POCKETBASE_URL_PROD }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_PROD }}

      - name: Build App Bundle (Release)
        env:
          CI: "true"
          CM_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare-production.outputs.prod_ver }}+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.prepare-production.outputs.prod_ver }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENV=prod \
            --dart-define=API_URL=${{ secrets.POCKETBASE_URL_PROD }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_PROD }}

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-android-build
          path: build/app
          retention-days: 1

  # ==========================================
  # PRODUCTION: publish after both builds finish
  # ==========================================
  deploy-production:
    needs: [prepare-production, build-production-web, build-production-apk]
    if: |
      always() &&
      !cancelled() &&
      needs.prepare-production.result == 'success' &&
      needs.build-production-web.result == 'success' &&
      (needs.build-production-apk.result == 'success' || needs.build-production-apk.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same rationale as deploy-staging: serialize deploys to the prod server
    # across concurrent workflow runs so two merges close together can't
    # rsync into the same live directory at once.
    concurrency:
      group: deploy-production-server
      cancel-in-progress: false
    outputs:
      prod_ver: ${{ needs.prepare-production.outputs.prod_ver }}
      new_patch: ${{ needs.prepare-production.outputs.new_patch }}
      major: ${{ needs.prepare-production.outputs.major }}
      minor: ${{ needs.prepare-production.outputs.minor }}
      commit_sha: ${{ needs.prepare-production.outputs.commit_sha }}
      is_minimum_version: ${{ needs.prepare-production.outputs.is_minimum_version }}
      web_only: ${{ needs.prepare-production.outputs.web_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-web-build
          path: build/web

      - name: Download Android build artifact
        if: needs.prepare-production.outputs.web_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: production-android-build
          path: build/app

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prepare-production.outputs.prod_ver }}+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: dart run sentry_dart_plugin

      - name: Strip source maps from web bundle
        run: |
          chmod +x scripts/strip-web-source-maps.sh
          ./scripts/strip-web-source-maps.sh

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh prod

      - name: Upload APK Artifact
        if: needs.prepare-production.outputs.web_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        if: needs.prepare-production.outputs.web_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

      - name: Detect Play upload credentials
        if: needs.prepare-production.outputs.web_only != 'true'
        id: play_upload
        env:
          PLAYSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAYSTORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAYSTORE_SERVICE_ACCOUNT_JSON unset — skipping Play upload"
          fi

      - name: Upload to Google Play (internal testing)
        if: needs.prepare-production.outputs.web_only != 'true' && steps.play_upload.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.hznsystems.hzngyms
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ needs.prepare-production.outputs.prod_ver }}

  # ==========================================
  # RELEASE & SYNC
  # ==========================================
  release-and-sync:
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        if: needs.deploy-production.outputs.web_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk

      - name: Create Release (with APK)
        if: needs.deploy-production.outputs.web_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.deploy-production.outputs.prod_ver }}
          target_commitish: ${{ needs.deploy-production.outputs.commit_sha }}
          name: v${{ needs.deploy-production.outputs.prod_ver }}
          files: app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (web-only)
        if: needs.deploy-production.outputs.web_only == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.deploy-production.outputs.prod_ver }}
          target_commitish: ${{ needs.deploy-production.outputs.commit_sha }}
          name: v${{ needs.deploy-production.outputs.prod_ver }} (web-only)
          body: "Web-only production deploy — Android APK was skipped."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Version Manager
        env:
          NEW_PATCH: ${{ needs.deploy-production.outputs.new_patch }}
          MAJOR: ${{ needs.deploy-production.outputs.major }}
          MINOR: ${{ needs.deploy-production.outputs.minor }}
          IS_MIN_VER: ${{ needs.deploy-production.outputs.is_minimum_version }}
          URL: ${{ secrets.VERSION_MANAGER_URL }}
          ID: ${{ secrets.VERSION_COLLECTION_ID }}
          TOKEN: ${{ secrets.PB_TOKEN }}
        run: |
           if [ "$IS_MIN_VER" == "true" ]; then
             echo "::notice::Updating minimum version to $MAJOR.$MINOR.$NEW_PATCH"
             PAYLOAD=$(jq -n --argjson major "$MAJOR" --argjson minor "$MINOR" --argjson patch "$NEW_PATCH" \
               '{major: $major, minor: $minor, patch: $patch, minimumMajor: $major, minimumMinor: $minor, minimumPatch: $patch}')
           else
             PAYLOAD=$(jq -n --argjson major "$MAJOR" --argjson minor "$MINOR" --argjson patch "$NEW_PATCH" \
               '{major: $major, minor: $minor, patch: $patch}')
           fi

           if [ -z "$TOKEN" ]; then
              curl -s -X PATCH "$URL/$ID" -H "Content-Type: application/json" -d "$PAYLOAD"
           else
              curl -s -X PATCH "$URL/$ID" -H "Content-Type: application/json" -H "Authorization: $TOKEN" -d "$PAYLOAD"
           fi
