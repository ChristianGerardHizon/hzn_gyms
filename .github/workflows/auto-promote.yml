name: Auto Promote to Main

on:
  pull_request:
    types: [closed]
    branches: ["staging"]

jobs:
  promote:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'deploy') &&
      (
        contains(github.event.pull_request.labels.*.name, 'version:patch') ||
        contains(github.event.pull_request.labels.*.name, 'version:minor') ||
        contains(github.event.pull_request.labels.*.name, 'version:major')
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Calculate next version
        id: get_version
        env:
          URL: ${{ secrets.VERSION_MANAGER_URL }}
          ID: ${{ secrets.VERSION_COLLECTION_ID }}
        run: |
          # Read current version from the same source as the deploy workflow
          RESPONSE=$(curl -s "$URL/$ID")
          MAJOR=$(echo $RESPONSE | jq -r '.major')
          MINOR=$(echo $RESPONSE | jq -r '.minor')
          PATCH=$(echo $RESPONSE | jq -r '.patch')

          if [ "$MAJOR" == "null" ]; then
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "::warning::Failed to read version from API"
            exit 0
          fi

          # Determine bump type from the PR labels
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"version:major"'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            PATCH=$((PATCH + 1))
          else
            echo "::error::deploy label requires a version:* label (patch, minor, or major)"
            exit 1
          fi

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated next version: $VERSION"

      - name: Create PR from staging to main
        env:
          # Prefer GH_PAT when Actions cannot create PRs with GITHUB_TOKEN.
          # Repo: Settings → Actions → General → allow creating/approving PRs.
          # See docs/hzngyms-initial-setup.md
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if an open PR from staging to main already exists
          EXISTING=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head staging \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          WEB_ONLY=false
          if echo "$LABELS" | grep -q '"web-only"'; then
            WEB_ONLY=true
          fi

          WEB_ONLY_NOTE=""
          TITLE="v${VERSION}"
          if [ "$WEB_ONLY" = true ]; then
            WEB_ONLY_NOTE=" (**web only** — Android APK skipped)"
            TITLE="v${VERSION} (web-only)"
          fi

          # Labels forwarded from feature→staging: version:*, web-only, deploy, minimum version
          ADD_ARGS=()

          if echo "$LABELS" | grep -q '"version:major"'; then
            ADD_ARGS+=(--add-label "version:major")
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            ADD_ARGS+=(--add-label "version:minor")
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            ADD_ARGS+=(--add-label "version:patch")
          fi

          if echo "$LABELS" | grep -q '"minimum version"'; then
            ADD_ARGS+=(--add-label "minimum version")
          fi

          if [ "$WEB_ONLY" = true ]; then
            ADD_ARGS+=(--add-label "web-only")
          fi

          if echo "$LABELS" | grep -q '"deploy"'; then
            ADD_ARGS+=(--add-label "deploy")
          fi

          BODY=$(cat <<EOF
## Production Deployment — v${VERSION}

This PR tracks \`staging\` → \`main\` for production release **v${VERSION}**.

**Latest staging merge:** PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

Merging this PR will build and deploy **v${VERSION}** to production${WEB_ONLY_NOTE}.

> Auto-updated when another \`deploy\`-labeled PR merges to staging.
EOF
)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING from staging to main already exists — updating title, body, and labels for v${VERSION}."
            EDIT_ARGS=(--title "$TITLE" --body "$BODY")
            if [ ${#ADD_ARGS[@]} -gt 0 ]; then
              EDIT_ARGS+=("${ADD_ARGS[@]}")
            fi
            gh pr edit "$EXISTING" \
              --repo "${{ github.repository }}" \
              "${EDIT_ARGS[@]}"

            # Drop stale labels not present on the latest source PR
            if [ "$WEB_ONLY" != true ]; then
              gh pr edit "$EXISTING" --repo "${{ github.repository }}" --remove-label "web-only" 2>/dev/null || true
            fi
            CURRENT_VERSION_LABEL=""
            if echo "$LABELS" | grep -q '"version:major"'; then CURRENT_VERSION_LABEL="version:major"
            elif echo "$LABELS" | grep -q '"version:minor"'; then CURRENT_VERSION_LABEL="version:minor"
            elif echo "$LABELS" | grep -q '"version:patch"'; then CURRENT_VERSION_LABEL="version:patch"
            fi
            for L in version:major version:minor version:patch; do
              if [ "$L" != "$CURRENT_VERSION_LABEL" ]; then
                gh pr edit "$EXISTING" --repo "${{ github.repository }}" --remove-label "$L" 2>/dev/null || true
              fi
            done
            if ! echo "$LABELS" | grep -q '"deploy"'; then
              gh pr edit "$EXISTING" --repo "${{ github.repository }}" --remove-label "deploy" 2>/dev/null || true
            fi
            if ! echo "$LABELS" | grep -q '"minimum version"'; then
              gh pr edit "$EXISTING" --repo "${{ github.repository }}" --remove-label "minimum version" 2>/dev/null || true
            fi

            echo "Updated existing staging→main PR #$EXISTING to v${VERSION} (commits follow the staging branch tip)."
            exit 0
          fi

          set +e
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head staging \
            --base main \
            --title "$TITLE" \
            --body "$BODY" 2>&1)
          CREATE_STATUS=$?
          set -e

          if [ $CREATE_STATUS -ne 0 ]; then
            echo "::error::Failed to create staging→main PR: $PR_URL"
            echo "::error::Enable Actions 'Allow GitHub Actions to create and approve pull requests', or set secret GH_PAT. See docs/hzngyms-initial-setup.md"
            exit 1
          fi

          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')

          echo "Created PR #$PR_NUMBER"

          if [ ${#ADD_ARGS[@]} -gt 0 ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              "${ADD_ARGS[@]}"
            echo "Forwarded labels: ${ADD_ARGS[*]}"
          fi
