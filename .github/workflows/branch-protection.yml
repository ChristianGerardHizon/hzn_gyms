name: Branch Protection

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
    branches: ["main"]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch flow
        if: github.head_ref != 'staging'
        run: |
          echo "::error::Only the 'staging' branch can be merged into 'main'. Current source branch: '${{ github.head_ref }}'"
          exit 1
      - name: Branch check passed
        if: github.head_ref == 'staging'
        run: echo "Source branch is 'staging'. Check passed."

  check-version-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require version bump label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"version:major"'; then
            echo "Found version:major — check passed."
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            echo "Found version:minor — check passed."
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            echo "Found version:patch — check passed."
          else
            echo "::error::Missing version label! Add one of: version:patch, version:minor, version:major"
            echo "Production deploy needs a version bump label so the build is handled correctly."
            exit 1
          fi
